name: WordPress Test Automation

on:
  workflow_dispatch: # GitHub 웹페이지에서 수동으로 즉시 실행할 수 있게 해줍니다.

jobs:
  post-to-wp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run Python Script
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: |
          python -c '
          import os
          import requests
          from requests.auth import HTTPBasicAuth

          wp_url = os.environ["WP_URL"]
          wp_user = os.environ["WP_USER"]
          wp_app_password = os.environ["WP_APP_PASSWORD"]

          post_data = {
              "title": "GitHub Actions로 쓴 첫 번째 워드프레스 글",
              "content": "<p>안녕하세요! GitHub 서버가 워드프레스 API를 통해 작성한 테스트 글입니다.</p>",
              "status": "publish"
          }

          response = requests.post(
              wp_url,
              json=post_data,
              auth=HTTPBasicAuth(wp_user, wp_app_password)
          )

          if response.status_code == 201:
              print("✅ GitHub Actions를 통한 워드프레스 포스팅 성공!")
          else:
              print(f"❌ 실패: {response.text}")
          '
