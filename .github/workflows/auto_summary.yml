name: Daily Auto Summary & Posting Bot

on:
  schedule:
    - cron: '0 22 * * *' # 매일 UTC 기준 밤 10시 (한국 시간 오전 7시)에 실행
  workflow_dispatch: # 웹에서 수동으로 실행 버튼

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser google-generativeai requests

      - name: Run Python scripts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: |
          echo "=== 1. BMW 뉴스 포스팅 봇 실행 ==="
          python main.py
          
          echo "=== 2. 전기차 보조금 및 인프라 리포트 봇 실행 ==="
          python ev_report_bot.py
