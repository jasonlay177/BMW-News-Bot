name: Daily Auto Summary & Posting Bot

on:
  schedule:
    - cron: '0 22 * * *' # 매일 UTC 기준 밤 10시 (한국 시간 오전 7시)에 실행
  workflow_dispatch: # 웹에서 수동으로 실행 버튼

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    # 깃허브 저장소에 파일을 수정·커밋할 수 있는 권한 부여
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser google-generativeai requests

      - name: Run Python scripts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PUBLIC_API_KEY: ${{ secrets.PUBLIC_API_KEY }}
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: |
          echo "=== 1. BMW 뉴스 포스팅 봇 실행 ==="
          python main.py
          
          echo "=== 2. 부동산 정보 포스팅 봇 실행 ==="
          python real_estate_bot.py
