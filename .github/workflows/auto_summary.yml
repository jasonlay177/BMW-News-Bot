name: Daily BMW News Auto Summary

on:
  schedule:
    - cron: '0 23 * * *' # 매일 UTC 기준 밤 11시 (한국 시간 아침 8시)에 실행
  workflow_dispatch: # 웹에서 수동으로도 버튼을 눌러 실행할 수 있게 해주는 기능

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      # 1. 내 저장소의 코드를 가져오기
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 파이썬 환경 세팅
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. 필요한 라이브러리 설치 (feedparser, google-generativeai)
      - name: Install dependencies
        run: |
          pip install feedparser google-generativeai

      # 4. 파이썬 코드 실행 (아까 만든 main.py 실행 + API 키 전달)
      - name: Run Python script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python main.py
